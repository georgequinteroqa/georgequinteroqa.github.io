<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141822">
<title>Kart Relámpago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
:root{
  --ink:#10131a; --panel:rgba(14,17,24,.62); --line:rgba(255,255,255,.18);
  --sun:#ffd23f; --hot:#ff5a36; --sea:#2ec4b6; --text:#f6f3ea; --muted:#c3c9d3;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8f2;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:"Rubik",system-ui,sans-serif;color:var(--text)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.disp{font-family:"Bungee","Rubik",system-ui,sans-serif;letter-spacing:.02em}
#hud{position:fixed;inset:0;pointer-events:none}
.hud-tl{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;display:flex;align-items:baseline;gap:2px}
#pos{font-size:54px;line-height:1;color:#fff;text-shadow:0 3px 0 #1b2030,0 0 2px #1b2030,0 6px 14px rgba(0,0,0,.35)}
#posOf{font-size:18px;color:#fff;text-shadow:0 2px 0 #1b2030}
#tacho{position:absolute;right:12px;bottom:10px;width:130px;height:130px;pointer-events:none}
#tabla{position:absolute;right:12px;top:200px;list-style:none;margin:0;padding:0;
  display:flex;flex-direction:column;gap:2px;pointer-events:none;font-size:11px;font-weight:700}
#tabla li{display:flex;align-items:center;gap:5px;padding:2px 8px 2px 4px;border-radius:9px;
  background:rgba(12,16,28,.55);color:#e7ecf5;text-shadow:0 1px 0 rgba(0,0,0,.6)}
#tabla li.yo{background:rgba(255,210,63,.92);color:#1b2030;text-shadow:none}
#tabla li b{width:13px;text-align:right;opacity:.75}
#tabla li i{width:9px;height:9px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.35)}
#tabla li span{max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:720px){#tabla{display:none}#tacho{width:96px;height:96px}}
.hud-tr{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 11px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
#time{color:var(--muted)}
#coins{display:flex;align-items:center;gap:6px;color:var(--sun);font-size:16px}
#coins i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc83d 45%,#d99a00);box-shadow:0 0 0 1.5px #b37d00}
#mini{width:112px;height:86px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#slot{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:72px;height:72px;border-radius:50%;
  background:rgba(14,17,24,.55);border:3px solid rgba(255,255,255,.75);pointer-events:auto;padding:0;display:grid;place-items:center;cursor:pointer;touch-action:none}
#slot canvas{width:52px;height:52px}
#slot:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
#snd{position:absolute;top:calc(76px + env(safe-area-inset-top,0px));left:16px;pointer-events:auto;cursor:pointer;color:var(--text);
  font:600 11px "Rubik",system-ui,sans-serif;letter-spacing:.06em}
#snd:focus-visible,#pauseBtn:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
#pauseBtn{position:absolute;top:calc(110px + env(safe-area-inset-top,0px));left:16px;pointer-events:auto;cursor:pointer;color:var(--text);
  font:600 11px "Rubik",system-ui,sans-serif;letter-spacing:.06em}
#pause .card{max-width:340px}
#pause .keys{text-align:center}
.bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:5px}
.turbo{width:min(40vw,220px);height:9px;border-radius:6px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
#turboFill{height:100%;width:0;background:#cfd5de}
#speed{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(34px,11vw,84px);color:var(--sun);
  text-shadow:0 4px 0 #b33a1e,0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
#banner.on{opacity:1}
#bars i{position:fixed;left:0;right:0;height:13vh;background:#000;z-index:5;transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#bars i:first-child{top:0;transform:translateY(-100%)}#bars i:last-child{bottom:0;transform:translateY(100%)}
#bars.on i{transform:none}
#hud.cine>*:not(#banner){opacity:0;transition:opacity .4s}
#hud.cine #banner{top:auto;bottom:calc(2vh + env(safe-area-inset-bottom,0px));z-index:6;font-size:clamp(28px,8vw,60px)}
#hint{position:absolute;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:600;font-size:14px;
  text-shadow:0 1px 4px rgba(0,0,0,.8);opacity:0;transition:opacity .4s}
#hint.on{opacity:1}
#knob{position:fixed;width:80px;height:80px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);pointer-events:none;display:grid;place-items:center}
#knobDot{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.75)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto;touch-action:pan-y;padding:16px;background:radial-gradient(ellipse at center,rgba(10,12,18,.25),rgba(10,12,18,.72))}
.card{margin:auto;width:min(100%,440px);background:#141822;border:1px solid var(--line);border-radius:22px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.title{font-size:clamp(30px,9vw,44px);line-height:.95;color:var(--sun);text-shadow:0 3px 0 #b33a1e;margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:14px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.racers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.racer{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#1b2030;color:var(--text);
  font:600 15px "Rubik",system-ui,sans-serif;cursor:pointer;text-align:left}
.racer canvas{width:44px;height:30px;flex:none}
.racer canvas.car{width:60px;height:30px}
.racer small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.racer[aria-pressed="true"]{border-color:var(--sun);background:#262b1c}
.racer:focus-visible,.go:focus-visible,.ghost:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.go{border:0;border-radius:14px;padding:14px;background:var(--hot);color:#fff;font:400 20px "Bungee","Rubik",system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 #a8321a}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #a8321a}
.ghost{border:1px solid var(--line);border-radius:14px;padding:12px;background:transparent;color:var(--text);font:600 15px "Rubik",system-ui,sans-serif;cursor:pointer}
.help{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.help b{color:var(--text)}
#err{color:#ffb4a8}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:9px 6px;border-bottom:1px solid var(--line);font-size:15px}
td:first-child{font-family:"Bungee","Rubik",sans-serif;color:var(--sun);width:38px}
td:last-child{text-align:right;color:var(--muted)}
tr.me td{background:rgba(255,210,63,.1)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.row{display:flex;gap:10px}.row>*{flex:1}
#nick{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#1b2030;color:var(--text);font:600 15px "Rubik",system-ui,sans-serif}
#nick:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
#lobby{display:flex;flex-direction:column;gap:10px}[hidden]{display:none!important}
#lobbyList{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text)}
@media (prefers-reduced-motion:reduce){#banner,#hint{transition:none}}
</style>

</head>
<body>
<canvas id="game" aria-label="Pista de carreras en 3D por Guatemala"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="touch" hidden></div>
<div id="knob" hidden><div id="knobDot"></div></div>

<div id="bars" aria-hidden="true"><i></i><i></i></div>
<div id="hud" hidden>
  <div class="hud-tl"><span id="pos" class="disp">1°</span><span id="posOf" class="disp">/4</span></div>
  <button id="snd" class="chip" aria-pressed="true">SONIDO: SÍ</button>
  <button id="pauseBtn" class="chip" aria-label="Pausar">❚❚ PAUSA</button>
  <button id="slot" aria-label="Usar objeto"><canvas id="slotC" width="128" height="128"></canvas></button>
  <div class="hud-tr">
    <div id="lap" class="chip">VUELTA 1/3</div>
    <div id="time" class="chip">0:00.00</div>
    <div id="coins" class="chip"><i></i><span id="coinN">0</span></div>
    <canvas id="mini" width="224" height="172"></canvas>
  </div>
  <div class="bottom">
    <div class="turbo" aria-hidden="true"><div id="turboFill"></div></div>
    <div id="speed">0 km/h</div>
  </div>
  <!-- Aguja abajo a la derecha: de un vistazo se ve si vas lanzado o frenando,
       sin tener que leer el numero. -->
  <canvas id="tacho" width="260" height="260" aria-hidden="true"></canvas>
  <ol id="tabla" aria-label="Posiciones"></ol>
  <div id="hint"></div>
  <div id="banner" class="disp"></div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <div>
      <h1 class="title disp">Kart<br>Relámpago</h1>
      <p class="sub">Circuito Guatemala · Arco de Santa Catalina, Tikal, volcanes y lago de Atitlán</p>
    </div>
    <div class="label">Elige tu carro</div>
    <div class="racers" id="cars"></div>
    <div class="label">Elige tu piloto</div>
    <div class="racers" id="racers"></div>
    <div hidden>
      <button class="racer" id="modeSolo" aria-pressed="true"><span>Solo</span></button>
      <button class="racer" id="modeOnline" aria-pressed="false"><span>Online</span></button>
    </div>
    <div id="lobby" hidden>
      <label class="label" for="nick">Tu nombre en la carrera</label>
      <input id="nick" maxlength="14" autocomplete="off">
      <div id="lobbyList"></div>
      <p class="help" id="lobbyMsg" role="status"></p>
    </div>
    <p class="help" id="help"></p>
    <div class="row" style="align-items:center">
      <button class="ghost" id="testSnd">Probar sonido</button>
      <span class="help" id="sndState" role="status">Audio: sin iniciar</span>
    </div>
    <button class="go" id="startBtn">¡A correr!</button>
  </div>
</div>

<div id="results" class="overlay" hidden>
  <div class="card">
    <h2 class="title disp" id="resTitle">¡Meta!</h2>
    <table id="resTable" aria-label="Resultados"></table>
    <div class="row">
      <button class="ghost" id="menuBtn">Cambiar carro</button>
      <button class="go" id="againBtn">Otra vez</button>
    </div>
  </div>
</div>

<div id="pause" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
  <div class="card">
    <h2 class="title disp" id="pauseTitle">Pausa</h2>
    <button class="go" id="resumeBtn">Continuar</button>
    <button class="ghost" id="restartBtn">Reiniciar carrera</button>
    <button class="ghost" id="pMenuBtn">Volver al menú</button>
    <p class="help keys">Esc o P para continuar</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const LAPS=3, MAX=340, ACC=300, BRAKE=520, ROAD=150, WALL=112;
const CHARS=[
  {name:'Kaito', tag:'Ninja del viento', color:'#ff5a36', type:'ninja',  skin:'#ffd9b8', hair:'#28305a', shirt:'#1f2233', acc:'#e5383b'},
  {name:'Yume',  tag:'Chica estelar',    color:'#2ec4b6', type:'maga',   skin:'#ffe0c7', hair:'#ff7eb6', shirt:'#ffffff', acc:'#ffd23f'},
  {name:'Draco', tag:'Dragoncito veloz', color:'#ffb627', type:'dragon', skin:'#3fbf5a', hair:'#f3e6c0', shirt:'#3fbf5a', acc:'#ff5a36'},
  {name:'Boru',  tag:'Muñeco robot',     color:'#8f6bff', type:'robot',  skin:'#9db7ff', hair:'#ff4d6d', shirt:'#5b6ea8', acc:'#5ff4ff'},
  {name:'Ixchel',tag:'Princesa maya',    color:'#2bb24c', type:'ixchel', skin:'#c68b5b', hair:'#1f1410', shirt:'#e63946', acc:'#ffd23f'},
  {name:'Tito',  tag:'Tucán acelerado',  color:'#1d7bd8', type:'toucan', skin:'#16161a', hair:'#ff8c1a', shirt:'#16161a', acc:'#ffd23f'},
  {name:'Luna',  tag:'Chica gata',       color:'#ff7eb6', type:'cat',    skin:'#ffe0c7', hair:'#3b2a5c', shirt:'#9b5de5', acc:'#ffd23f'},
  {name:'Bongo', tag:'Panda bonachón',   color:'#4b5563', type:'panda',  skin:'#f7f7f2', hair:'#16161a', shirt:'#2bb24c', acc:'#ffffff'},
  {name:'Leo',   tag:'Melena al viento', color:'#e07a5f', type:'melena', skin:'#e8b894', hair:'#5a3a22', shirt:'#1f2230', acc:'#c8ccd4'}
];
const CARS=[
  {name:'Saetta X', tag:'Superdeportivo en cuña', seat:-2, wing:'low', scoop:false, splitter:true,
    body:[[-24,4],[-24.5,11],[-13,12.2],[4,11.2],[14,9.6],[24,7],[25.5,5],[24.5,3.5]], eng:{mult:1.35,bright:1.35,lump:.12,noise:.10}},
  {name:'Bravo V8', tag:'Muscle car de motor grande', seat:-5, wing:'lip', scoop:true, splitter:false,
    body:[[-24.5,4],[-25,12.3],[-16,13],[7,13.4],[24,12.6],[25,8],[24.5,3.5]], eng:{mult:.72,bright:.75,lump:.5,noise:.16}},
  {name:'Volta GT', tag:'Gran turismo de curvas suaves', seat:-5, wing:'none', scoop:false, splitter:false,
    body:[[-24,4],[-24.5,10.5],[-19,12.6],[-5,13.2],[12,11.4],[24,8.4],[25.5,5.5],[24.5,3.5]], eng:{mult:1.05,bright:1,lump:.25,noise:.12}},
  {name:'Nimbus R', tag:'Cupé de carreras con alerón', seat:-3, wing:'high', scoop:false, splitter:true,
    body:[[-24,4],[-24.5,11.6],[-11,12.6],[9,11.8],[24,8.6],[25.5,5.2],[24.5,3.5]], eng:{mult:1.2,bright:1.2,lump:.2,noise:.12}}
];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const $=id=>document.getElementById(id);

/* ---------- track data ---------- */
const CP=[[350,1300],[350,950],[350,650],[365,450],[430,310],[570,245],[800,240],[1150,240],[1380,280],[1520,420],[1700,470],[1880,420],[2020,300],[2220,240],[2400,330],[2470,500],[2470,800],[2470,1150],[2470,1450],[2410,1680],[2230,1800],[1900,1830],[1500,1830],[1100,1830],[700,1830],[480,1820],[370,1750],[350,1600]];
function catmull(pts,seg){const o=[],n=pts.length;for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
  for(let s=0;s<seg;s++){const t=s/seg,t2=t*t,t3=t2*t;const f=j=>0.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);o.push({x:f(0),y:f(1)})}}return o}
function resample(pts,step){const n=pts.length,seg=[];let L=0;for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];const d=Math.hypot(b.x-a.x,b.y-a.y);seg.push(d);L+=d}
  const N=Math.floor(L/step),st=L/N,o=[];let i=0,acc=0;for(let k=0;k<N;k++){const tg=k*st;while(i<n-1&&acc+seg[i]<tg){acc+=seg[i];i++}
  const a=pts[i],b=pts[(i+1)%n],t=seg[i]?(tg-acc)/seg[i]:0;o.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}return o}
const P=resample(catmull(CP,24),10), N=P.length;
P.forEach((p,i)=>{const a=P[(i-1+N)%N],b=P[(i+1)%N];p.a=Math.atan2(b.y-a.y,b.x-a.x)});
const at=(i,o)=>{const p=P[((i%N)+N)%N];return{x:p.x-Math.sin(p.a)*o,y:p.y+Math.cos(p.a)*o}};
const PADS=[Math.floor(N*.16),Math.floor(N*.47),Math.floor(N*.74)];
const BOXES=[.3,.6,.9].flatMap(f=>[-48,-16,16,48].map(o=>({i:Math.floor(N*f),o})));
const COINS=[.08,.22,.42,.53,.7,.82].flatMap((f,r)=>[0,4,8,12,16].map(j=>({i:Math.floor(N*f)+j,o:[-38,0,38][r%3]+Math.sin(j*.4)*10})));
const BAN0=[[.36,-30],[.37,30],[.66,0],[.94,-35]];
const W=2850,H=2150;
const VAM={x:1800,y:1400}, CAMP={x:800,y:1150}, TWR={x:1000,y:-85};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

const palms=[];
const tc=document.createElement('canvas');tc.width=W;tc.height=H;
(function(){const g=tc.getContext('2d');
  g.fillStyle='#48a457';g.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=180){g.fillStyle='rgba(0,40,10,.08)';g.fillRect(x,0,90,H)}
  for(const m of[VAM,CAMP]){g.fillStyle='#d9d2c3';g.beginPath();g.arc(m.x,m.y,150,0,7);g.fill();g.strokeStyle='#bfb6a3';g.lineWidth=6;g.stroke()}
  const path=()=>{g.beginPath();P.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath()};
  g.lineJoin='round';g.lineCap='round';
  path();g.strokeStyle='#e6d29a';g.lineWidth=ROAD+100;g.stroke();
  path();g.strokeStyle='#f4f4f4';g.lineWidth=ROAD+22;g.stroke();
  path();g.strokeStyle='#d7332b';g.setLineDash([26,26]);g.stroke();g.setLineDash([]);
  path();g.strokeStyle='#5a5d66';g.lineWidth=ROAD;g.stroke();
  path();g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=4;g.setLineDash([34,34]);g.stroke();g.setLineDash([]);
  const s=P[0];g.save();g.translate(s.x,s.y);g.rotate(s.a);
  for(let r=0;r<2;r++)for(let c=-5;c<5;c++){g.fillStyle=(r+c)&1?'#fff':'#15161a';g.fillRect(r*15-15,c*15,15,15)}g.restore();
  PADS.forEach(i=>{const p=P[i];g.save();g.translate(p.x,p.y);g.rotate(p.a);
    g.fillStyle='#ffd23f';g.fillRect(-34,-38,68,76);g.strokeStyle='#ff5a36';g.lineWidth=8;
    for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(k*18-8,-22);g.lineTo(k*18+8,0);g.lineTo(k*18-8,22);g.stroke()}g.restore()});
  for(let t=0;t<170;t++){const x=rnd()*W,y=rnd()*H;let md=1e9;for(let i=0;i<N;i+=4){const d=Math.hypot(P[i].x-x,P[i].y-y);if(d<md)md=d}
    if(md<185||Math.hypot(x-VAM.x,y-VAM.y)<190||Math.hypot(x-CAMP.x,y-CAMP.y)<190||Math.hypot(x-TWR.x,y-TWR.y)<210||Math.hypot(x-1450,y-1150)<110)continue;
    const s=.8+rnd()*.6;palms.push({x,y,s,r:rnd()*6.3,tx:(rnd()-.5)*.25,tz:(rnd()-.5)*.25});
    g.fillStyle='rgba(0,0,0,.16)';g.beginPath();g.ellipse(x+22*s,y+14*s,44*s,34*s,0,0,7);g.fill()}
})();

/* ---------- 2D icons ---------- */

// El logo se dibuja entero (ola verde, sol naranja y lema) y no solo la
// palabra: pasando a 170 km/h lo que se reconoce es la forma y el color.
const BVERDE='#04663c', BVERDE2='#0a7a45', BNARANJA='#f26522';
// Dibuja la marca dentro del rectangulo dado, escalada a su altura.
function marcaBan(g,x,y,w,h,sobreOscuro){
  const verde=sobreOscuro?'#ffffff':BVERDE;
  g.save();g.translate(x,y);
  // Sol: asoma por detras de la ola, a la derecha.
  g.fillStyle=BNARANJA;g.beginPath();g.arc(w*.66,h*.30,h*.235,0,7);g.fill();
  // Ola: sube desde la izquierda, hace cresta y baja tapando el sol.
  g.strokeStyle=verde;g.lineWidth=h*.085;g.lineCap='round';g.lineJoin='round';
  g.beginPath();g.moveTo(w*.04,h*.52);
  g.bezierCurveTo(w*.22,h*.50,w*.30,h*.16,w*.46,h*.16);
  g.bezierCurveTo(w*.62,h*.16,w*.74,h*.44,w*.97,h*.30);
  g.stroke();
  // Palabra
  g.fillStyle=verde;g.textAlign='center';g.textBaseline='middle';
  let fs=h*.40;g.font='900 '+fs+'px Rubik, system-ui, sans-serif';
  while(g.measureText('BANRURAL').width>w*.94&&fs>6){fs-=1;g.font='900 '+fs+'px Rubik, system-ui, sans-serif'}
  g.fillText('BANRURAL',w/2,h*.74);

// Gradas con publico.
//
// Es lo que mas se echaba en falta: sin gente en los lados, la pista parecia
// un circuito vacio en vez de una carrera. Cada espectador es una instancia
// de la misma caja (miles de mallas sueltas hundirian los fps), y la
// animacion se hace moviendo matrices en bloque solo en las gradas cercanas.
const gradas=[];
(function(){
  // [fraccion de vuelta, lado, filas, largo en segmentos]
  //
  // Las dos tribunas de meta van desplazadas de la linea de salida: puestas
  // justo encima, la de la izquierda se comia media pantalla en la salida.
  const ASIENTOS=[
    // Pasada la meta, no encima de la parrilla: puestas antes de la linea,
    // en la salida se comian el lado izquierdo de la pantalla.
    [.05,-1,5,22],[.05,1,5,22],
    [.13,1,4,16],[.27,-1,4,16],
    [.42,1,4,18],[.55,-1,4,14],
    [.68,1,5,20],[.83,-1,4,16],
  ];
  const COLS=['#ffd23f','#e63946','#1d7bd8','#2bb24c','#ff6a13','#ffffff','#7b3ff2','#00a6a6',
              '#f06292','#ffe082','#8d6e63','#26c6da'];
  const cuerpo=new THREE.BoxGeometry(6,10,5), cabeza=new THREE.SphereGeometry(2.9,6,5);
  const estructura=lam('#e8edf5'), escalon=lam('#b9c2d2'), techo=lam('#e63946');
  const PASO=9;              // separacion entre espectadores
  let total=0;
  for(const [,,filas,largo] of ASIENTOS) total+=filas*Math.round(largo*10/PASO);

  const cuerpos=new THREE.InstancedMesh(cuerpo,new THREE.MeshLambertMaterial({}),total);
  const cabezas=new THREE.InstancedMesh(cabeza,new THREE.MeshLambertMaterial({}),total);
  cuerpos.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  cabezas.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const o=new THREE.Object3D(); let n=0;

  for(const [f,lado,filas,largo] of ASIENTOS){
    const i0=Math.floor(N*f), base=at(i0,lado*(WALL+58)), ctr=P[i0];
    const ang=-ctr.a;
    const g=new THREE.Group(); g.position.set(base.x,0,base.y); g.rotation.y=ang;
    const ancho=largo*10;
    // Graderio: un escalon por fila, cada uno mas alto y mas atras.
    for(let r=0;r<filas;r++){
      const paso=new THREE.Mesh(new THREE.BoxGeometry(13,7+r*7,ancho),escalon);
      paso.position.set(lado*(13+r*13),(7+r*7)/2,0); g.add(paso);
    }
    const suelo=new THREE.Mesh(new THREE.BoxGeometry(filas*13+16,4,ancho+16),estructura);
    suelo.position.set(lado*(filas*6.5+8),2,0); g.add(suelo);
    // Vallita delantera con el color del circuito: remata la grada por abajo
    // y evita que el publico parezca flotar sobre la hierba.
    const valla=new THREE.Mesh(new THREE.BoxGeometry(3,9,ancho+14),lam('#e63946'));
    valla.position.set(lado*5,5,0); g.add(valla);
    // Techo volado: alto y estrecho, para que no se coma la vista de la pista.
    const alto=7+filas*7+34;
    for(const z of[-ancho/2+6,ancho/2-6]){
      const pl=new THREE.Mesh(new THREE.BoxGeometry(5,alto,5),estructura);
      pl.position.set(lado*(filas*13+6),alto/2,z); g.add(pl);
    }
    const tch=new THREE.Mesh(new THREE.BoxGeometry(filas*13+22,4,ancho+12),techo);
    tch.position.set(lado*(filas*6.5+12),alto,0); tch.rotation.z=lado*.05; g.add(tch);
    // Fachada trasera. Desde dentro del circuito se ve la espalda de las
    // gradas de enfrente, y sin esto es un paredon gris liso; con el cartel
    // repetido parece el exterior de un estadio.
    const traseraTex=AD[Math.floor(f*10)%AD.length].clone();
    traseraTex.needsUpdate=true;
    traseraTex.wrapS=THREE.RepeatWrapping; traseraTex.repeat.x=Math.max(2,Math.round(ancho/150));
    const tras=new THREE.Mesh(new THREE.PlaneGeometry(ancho,alto*.62),
      new THREE.MeshBasicMaterial({map:traseraTex}));
    tras.position.set(lado*(filas*13+4),alto*.31,0);
    tras.rotation.y=lado>0?Math.PI/2:-Math.PI/2;
    g.add(tras);
    scene.add(g);

    // Espectadores sentados en los escalones.
    const porFila=Math.round(ancho/PASO);
    for(let r=0;r<filas;r++)for(let k=0;k<porFila;k++){
      const dx=lado*(13+r*13)+(rnd()-.5)*4, dy=7+r*7, dz=-ancho/2+5+k*PASO+(rnd()-.5)*3;
      const c=new THREE.Color(COLS[(r*7+k*3+Math.floor(f*100))%COLS.length]);
      cuerpos.setColorAt(n,c);
      cabezas.setColorAt(n,new THREE.Color(['#f2c9a0','#d8a072','#8d5524','#f7d9b8'][(k+r)%4]));
      gradas.push({x:base.x+Math.cos(ang)*dx-Math.sin(ang)*dz, y:dy,
                   z:base.y+Math.sin(ang)*dx+Math.cos(ang)*dz,
                   ang, ph:(k*1.7+r*2.3)%6.283, salto:0});
      n++;
    }
  }
  cuerpos.count=n; cabezas.count=n;
  // Posicion inicial; a partir de ahi solo se tocan las cercanas.
  gradas.forEach((e,j)=>{
    o.position.set(e.x,e.y+5.5,e.z); o.rotation.set(0,e.ang,0); o.updateMatrix();
    cuerpos.setMatrixAt(j,o.matrix);
    o.position.y=e.y+14; o.updateMatrix(); cabezas.setMatrixAt(j,o.matrix);
  });
  cuerpos.instanceMatrix.needsUpdate=true; cabezas.instanceMatrix.needsUpdate=true;
  if(cuerpos.instanceColor)cuerpos.instanceColor.needsUpdate=true;
  if(cabezas.instanceColor)cabezas.instanceColor.needsUpdate=true;
  scene.add(cuerpos,cabezas);
  gradas.cuerpos=cuerpos; gradas.cabezas=cabezas; gradas.o=o;
})();

// El publico salta y se balancea, pero solo el que esta cerca de la camara:
// animar miles de instancias cada fotograma cuesta mas de lo que se ve.
function animPublico(t){
  const {cuerpos,cabezas,o}=gradas; if(!cuerpos)return;
  const cx=camera.position.x, cz=camera.position.z, R=620*620;
  let tocadas=0;
  for(let j=0;j<gradas.length;j++){
    const e=gradas[j], dx=e.x-cx, dz=e.z-cz;
    if(dx*dx+dz*dz>R)continue;
    const s=Math.sin(t*3.1+e.ph);
    const y=e.y+5.5+Math.max(0,s)*5.5;
    o.position.set(e.x,y,e.z); o.rotation.set(0,e.ang,s*.18); o.updateMatrix();
    cuerpos.setMatrixAt(j,o.matrix);
    o.position.y=y+8.5; o.updateMatrix(); cabezas.setMatrixAt(j,o.matrix);
    tocadas++;
  }
  if(tocadas){cuerpos.instanceMatrix.needsUpdate=true;cabezas.instanceMatrix.needsUpdate=true}
}

const tachoC=$('tacho'), tk=tachoC.getContext('2d');

const TACHO_MAX=190;                    // km/h a fondo de escala
function dibujaTacho(kmh,marcha){
  const v=Math.round(kmh);
  if(v===tachoPrev&&marcha===tachoMarcha)return;
  tachoPrev=v;tachoMarcha=marcha;
  const R=130,r=108,A0=Math.PI*.78,A1=Math.PI*2.22;
  tk.clearRect(0,0,260,260);
  tk.lineCap='round';
  tk.beginPath();tk.arc(R,R,r,A0,A1);tk.lineWidth=15;tk.strokeStyle='rgba(12,16,28,.62)';tk.stroke();
  const f=clamp(v/TACHO_MAX,0,1), a=A0+(A1-A0)*f;
  tk.beginPath();tk.arc(R,R,r,A0,a);tk.lineWidth=11;
  tk.strokeStyle=f>.86?'#ff5a36':f>.6?'#ffd23f':'#4cc9ff';tk.stroke();
  // Marcas cada 20 km/h
  tk.strokeStyle='rgba(255,255,255,.55)';tk.lineWidth=3;
  for(let k=0;k<=TACHO_MAX;k+=20){const t=A0+(A1-A0)*(k/TACHO_MAX);
    tk.beginPath();tk.moveTo(R+Math.cos(t)*(r-16),R+Math.sin(t)*(r-16));
    tk.lineTo(R+Math.cos(t)*(r-26),R+Math.sin(t)*(r-26));tk.stroke()}

  tk.strokeStyle='#ff5a36';tk.lineWidth=7;
  tk.beginPath();tk.moveTo(R-Math.cos(a)*18,R-Math.sin(a)*18);
  tk.lineTo(R+Math.cos(a)*(r-30),R+Math.sin(a)*(r-30));tk.stroke();

  tk.fillText('km/h  '+marcha,R,R+88);
}

    {const sv=Math.abs(player.vf);$('speed').textContent=Math.round(sv*.5)+' km/h · '+(sv<4?'N':gearOf(sv)+'ª');
      dibujaTacho(sv*.5,sv<4?'N':gearOf(sv)+'ª')}
    pintaTabla();
    const tf=$('turboFill');
    if(player.drifting){tf.style.width=Math.min(100,player.charge/2*100)+'%';tf.style.background=player.charge>=2?'#ff8a1f':player.charge>=1?'#4cc9ff':'#cfd5de'}
    else if(player.boost>0){tf.style.width=Math.min(100,player.boost/1.25*100)+'%';tf.style.background='#ffd23f'}
    else tf.style.width='0%';
    const show=player.roll>0?ITEMS[Math.floor(clock*12)%ITEMS.length]:player.item||'';
    if(show!==slotShown){slotShown=show;drawItem(slotC,show)}
    const pb=player.boost>0;prevBoost=pb;
    drawMini();
    if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('on')}
    if(hintT>0){hintT-=dt;if(hintT<=0)$('hint').classList.remove('on')}
  }
  sync(dt,clock);drawFx(dt);if(!paused)audioTick(dt);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
